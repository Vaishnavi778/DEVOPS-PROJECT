vulnerabilities:
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    statement: >-
      Temporary SBOM discrepancy: Trivy's filesystem inventory identifies setuptools 84.2.1,
      but the image SBOM reports setuptools 70.3.0. Recheck after the SBOM is refreshed.
    expired_at: 2026-12-25

misconfigurations:
  - id: AWS-0104
    paths:
      - infra/terraform/main.tf
      - terraform-aws-modules/eks/aws/node_groups.tf
    statement: >-
      Temporary, documented exception: worker egress is limited to outbound TCP/443
      for GHCR image pulls and updates through the NAT gateway. No other ports or
      protocols are allowed. Replace with private registry endpoints or a controlled
      egress proxy before production.
    expired_at: 2027-01-31
